# Minimal CI. Uses only the RECORDED real-road test matrices committed under tests/fixtures:
# no live map tiles (live tests stay skipped), no real credentials, no repository secrets.
# Runs on pull_request (never pull_request_target), so forked pull requests get a read-only
# token and no secrets. Actions are pinned to full commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npx vite build
      - run: npm audit --audit-level=high

  api:
    name: API (pytest on PostgreSQL, recorded matrices)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway database in a job-local container; trust auth, so no password exists at all.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: routewise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/routewise_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/routewise_test
      ROUTEWISE_ENV: development
      ROUTEWISE_RESOLVE_SHORT_LINKS: "false"
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # The API serves apps/web/dist; building it lets the static-file and path-traversal tests run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the web app the API serves
        working-directory: apps/web
        run: npm ci && npx vite build
      - name: Per-run session secret (random, never stored)
        run: echo "ROUTEWISE_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q -p no:cacheprovider
      - name: Known-vulnerability audit of the locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --disable-pip --no-deps --progress-spinner off

  routing:
    name: Routing regression (Phase 0 spike, recorded fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spikes/routing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q -p no:cacheprovider
